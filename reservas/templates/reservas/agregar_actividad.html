{% load static %}
<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Agregar Actividad - Deportes Unca</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="{% static 'css/estiloBase.css' %}" rel="stylesheet">
    </head>
    <body>
        <header class="container text-center my-4">
            <h1>Registrar Nueva Actividad Deportiva</h1>
        </header>
        <nav class="container my-3">
            <ul class="nav flex-column flex-md-row justify-content-md-center">
                <li class="nav-item"> <a href="{% url 'reservas:lista_actividades' %}" class="nav-link">Volver al Listado</a></li>
            </ul>
        </nav>
        <main class="container px-4 my-5">
            <div class="row justify-content-center">
                <section class="col-12 col-md-8 col-lg-6">
                    <form method="POST" class="border p-4 rounded shadow-sm bg-light" enctype="multipart/form-data">
                        {% csrf_token %}
                        {% for field in form %}
                            <div class="mb-3">
                                <label for="{{ field.id_for_label }}" class="form-label fw-bold">{{ field.label }}</label>
                                {{ field }}
                                {% if field.errors %}
                                    <div class="text-danger small mt-1">
                                        {{ field.errors.0 }}
                                    </div>
                                {% endif %}
                            </div>
                        {% endfor %}
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-primary btn-lg">Guardar Actividad</button>
                        </div>
                    </form>
                </section>
            </div>
        </main>
        <footer class="py-3 border-top mt-5">
            <div class="container text-center">
                <a href="https://unca.edu.ar/deportes">Deportes Unca - 2026</a>
            </div>
        </footer>
    </body>
</html>
